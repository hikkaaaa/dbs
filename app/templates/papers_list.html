{% extends "base.html" %}
{% block content %}
<h1>Papers</h1>
<a href="{{ url_for('papers.create_paper') }}">+ New paper</a>
<table>
  <tr><th>ID</th><th>Title</th><th>Status</th><th>Conference</th><th>Track</th>
      <th>Session</th><th>Actions</th></tr>
  {% for p in papers %}
  <tr>
    <td>{{ p.paper_id }}</td>
    <td>{{ p.title }}</td>
    <td>{{ p.status }}</td>
    <td>{{ p.acronym }}</td>
    <td>{{ p.track_name }}</td>
    <td>{{ p.session_title or '—' }}</td>
    <td>
      <a href="{{ url_for('papers.show_paper', paper_id=p.paper_id) }}">View</a>
      <a href="{{ url_for('papers.edit_paper', paper_id=p.paper_id) }}">Edit</a>
      <form method="post" action="{{ url_for('papers.delete_paper', paper_id=p.paper_id) }}">
        <button>Delete</button>
      </form>
    </td>
  </tr>
  {% endfor %}
</table>
{% endblock %}
