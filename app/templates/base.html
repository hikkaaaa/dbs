<!-- The shared layout. Every other page fills in the "content" block. -->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Conference Review System</title>
  <style>
    body { font-family: sans-serif; margin: 20px; }
    nav a { margin-right: 15px; }
    table { border-collapse: collapse; margin: 10px 0; }
    th, td { border: 1px solid #aaa; padding: 5px 8px; text-align: left; vertical-align: top; }
    input, select, textarea { margin: 3px 0; padding: 4px; }
    textarea { width: 450px; }
    td form { display: inline; }
    .success { background: #dff0d8; padding: 10px; }
    .error { background: #f2dede; padding: 10px; }
  </style>
</head>
<body>
  <nav>
    <a href="{{ url_for('users.list_users') }}">Users</a>
    <a href="{{ url_for('papers.list_papers') }}">Papers</a>
    <a href="{{ url_for('reviews.list_reviews') }}">Reviews</a>
    <a href="{{ url_for('sessions.list_sessions') }}">Sessions</a>
  </nav>

  <!-- Success and error messages -->
  {% for category, message in get_flashed_messages(with_categories=true) %}
    <p class="{{ category }}">{{ message }}</p>
  {% endfor %}

  {% block content %}{% endblock %}
</body>
</html>
